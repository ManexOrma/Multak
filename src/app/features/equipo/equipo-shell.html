<div class="shell" [class.con-accion]="conAccion()">
  <nav class="lateral" [attr.aria-label]="t('nav.secciones')">
    <button
      type="button"
      class="equipo-actual"
      [attr.aria-label]="t('menu.abrir')"
      (click)="abrirMenu()"
    >
      <app-escudo
        [color]="equipo.miFicha()?.color"
        [secundario]="equipo.miFicha()?.color_secundario"
        [foto]="foto()"
        [tamano]="40"
      />
      <span class="nombre-equipo">{{ equipo.miFicha()?.equipo_nombre }}</span>
      <app-icono class="abrir" nombre="menu" [grosor]="2.2" />
    </button>

    @if (equipo.puedeGestionar()) {
      <button type="button" class="boton boton-tarjeta poner" (click)="ponerMulta()">
        <app-icono nombre="tarjeta" />
        {{ t('nav.poner-multa') }}
      </button>
    }

    <ul>
      @for (seccion of secciones; track seccion.ruta) {
        @if (visible(seccion)) {
          <li>
            <a
              [routerLink]="seccion.ruta"
              routerLinkActive="activa"
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="{ exact: seccion.ruta === '.' }"
            >
              <app-icono [nombre]="seccion.icono" />
              {{ t(seccion.clave) }}
            </a>
          </li>
        }
      }
    </ul>
  </nav>

  <div class="contenido">
    <router-outlet />
  </div>

  @if (conAccion()) {
    <button type="button" class="boton boton-tarjeta flotante" (click)="ponerMulta()">
      <app-icono nombre="tarjeta" />
      {{ t('nav.poner-multa') }}
    </button>
  }

  <nav class="pestanas" [attr.aria-label]="t('nav.secciones')">
    @for (seccion of secciones; track seccion.ruta) {
      @if (visible(seccion)) {
        <a
          [routerLink]="seccion.ruta"
          routerLinkActive="activa"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: seccion.ruta === '.' }"
        >
          <app-icono [nombre]="seccion.icono" />
          <span>{{ t(seccion.clave) }}</span>
        </a>
      }
    }
  </nav>
</div>
